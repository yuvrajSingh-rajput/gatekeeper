spring.application.name=api-management-service
server.port=8081

info.app.name=API Management Service
info.app.description=API Management Service for API Traffic Monitoring and Insights

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/gatekeeper_management?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Hibernate
spring.jpa.hibernate.ddl-auto=validate